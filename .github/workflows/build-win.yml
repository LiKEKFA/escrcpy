name: build-win

# 触发方式：
#   1) 推送形如 v3.3.2 的 tag  -> 自动构建并附加到该 tag 的 Release
#   2) Actions 页面手动 Run workflow -> 产物在本次 run 的 Artifacts 里；填 release_tag 则同时附加到该 Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：要附加产物的 Release tag（如 v3.3.2）。留空则只上传 Actions Artifacts。'
        required: false
        default: ''
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: build-win-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
      # 无签名证书，跳过证书自动查找，避免额外下载与告警
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        # 使用 package.json 的 packageManager 字段（pnpm@10.29.2），不依赖 lockfile
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies
        # 仓库未提交 pnpm-lock.yaml，因此不能使用 --frozen-lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Build Windows artifacts
        run: pnpm build:win

      - name: Show artifacts
        shell: pwsh
        run: Get-ChildItem desktop/dist-release | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: escrcpy-win
          path: |
            desktop/dist-release/*.exe
            desktop/dist-release/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Attach artifacts to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag || github.ref_name }}
          draft: false
          fail_on_unmatched_files: true
          files: |
            desktop/dist-release/*.exe
            desktop/dist-release/*.zip
